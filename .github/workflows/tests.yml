# The tests that can run anywhere.
#
# `-m "not slow"` is 148 tests in about five seconds, with no browser and no copy of
# the game: the fingerprint logic, the tables, the schema, the leaderboard, name
# resolution, the harness loading.
#
# The other 22 drive a real browser against the local copy of the game, and they do
# not belong here. `pokelike setup` downloads about 2100 files from pokelike.xyz,
# which takes four minutes and gets throttled: the site drops requests without
# saying so, and an incomplete copy does not fail loudly. It changes which options
# the bridge can see, because `__pk_choices` filters on `getBoundingClientRect`, so
# the run takes a different path and the golden comparison reports a behaviour
# change that is really a download problem. That is what the first attempt at this
# workflow did, on all four golden cases.
#
# So the browser tests stay local, where the copy is complete and verified:
#
#     uv run pytest -q
#
# Run that before pushing anything that touches src/ or llm-bench/.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'bots/**'
      - 'llm-bench/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run pytest -q -m "not slow"
