# Everything a long benchmark run needs, so it is one command rather than six
# flags that are easy to get wrong.
#
# Run from the repository root, pointing at this file. `--build` rebuilds the
# image first, so the container always runs the code you have on disk NOW (the
# layer cache makes it a near-no-op when nothing changed). Use it every time and
# a stale image can never quietly run old code:
#
#   cp .env.example .env        # put FW_ENDPOINT and FW_TOKEN in it
#   docker compose -f llm-bench/docker/docker-compose.yml run --build --rm bench \
#       --harness v0 --model z-ai/glm-5.2:free
#
# Detached, for the runs that take hours. `--build` refreshes the image, `--rm`
# makes the container remove ITSELF the moment the pass finishes (the results and
# logs are on the mounted volume, so nothing is lost); `docker stop` on it shuts
# the browser down gracefully via SIGTERM rather than being killed mid-write:
#
#   docker compose -f llm-bench/docker/docker-compose.yml run --build --rm -d --name sweep \
#       bench --harness v0 --models a/b,c/d --repeat 3 --workers 8
#   tail -f llm-bench/v0/logs/*.log     # from the host: the log is a mounted file
#   docker logs -f sweep                # or the container's own output
#
# The harness files (bot.py, render.py, bridge.js, init.js) are on the mounted
# volume and are always current; --build is what also refreshes the baked-in
# src/pokelike, which is the part a git pull changes.

# Named explicitly: compose otherwise takes the project name from the parent
# directory, which here would be "docker" -- and `docker ps` full of containers
# called docker-bench-1 tells you nothing about what is running.
name: pokelike-llm-bench

services:
  bench:
    build:
      # The context is the REPOSITORY ROOT, not this directory, and it has to be:
      # the image installs the pokelike package from src/ with pyproject.toml and
      # uv.lock, none of which live here. Every COPY in the Dockerfile is relative
      # to that root, which is worth knowing before reading it.
      context: ../..
      dockerfile: llm-bench/docker/Dockerfile
    # Chromium needs far more than Docker's default 64 MB of shared memory, and
    # eight workers need eight times it. Without this the browsers die mid-run
    # with errors that read like the game crashed rather than like a full /dev/shm.
    shm_size: 2gb
    # As the person who launched it, not as root. Everything a pass writes lands on
    # the mounted volume, and written by root it could not be tidied, moved or
    # deleted afterwards without sudo: `model stop` could not even remove the
    # heartbeat file of a pass it had just stopped, so the pass sat in `model watch`
    # looking alive until its mtime aged out. Verified that the browser still
    # launches under this uid (Chromium lives in the image, at /ms-playwright).
    user: "${UID:-1000}:${GID:-1000}"
    # Credentials from a file that is gitignored, never from the image and never
    # from this file. Model ids are not secret and go on the command line.
    env_file:
      # required: false so the container still starts without it -- --table and
      # --help need no credentials, and a missing .env should not read as a broken
      # compose file.
      - path: ../../.env
        required: false
    # Paths are relative to THIS file, so ../.. is the repository root.
    volumes:
      # The game. Read-only: the container plays exactly the copy you downloaded
      # and verified with `pokelike mirror --phase verify`, and cannot quietly
      # repair or change it.
      - ../../site:/app/site:ro
      # The only writable mount, and the only one needed: results are the record,
      # logs are how you watch a run you are not sitting in front of, and the
      # frozen harnesses live here too.
      - ../../llm-bench:/app/llm-bench
      # DELIBERATELY NOT MOUNTED: bots/, experiments/ and stats/. This container is
      # for llm-bench and nothing else. The image can run any pokelike subcommand,
      # so without this restraint `bench --bot sarsa-v2` would happily record a
      # result.json inside the container and lose it on exit -- and recording a
      # score is the one step worth doing deliberately, on the host, where you can
      # see the fingerprint it writes.
    # A benchmark is not a service: it runs, it finishes, it should not come back
    # from the dead and start spending tokens again.
    restart: "no"
