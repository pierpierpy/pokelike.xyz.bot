[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokelike.xyz.bot"
version = "0.1.0"
description = "Let bots play pokelike.xyz, headless, from a CLI or an HTTP API"
requires-python = ">=3.10"
dependencies = ["playwright>=1.55", "tqdm>=4.66", "rich>=13.7,<15",
                "rich-argparse>=1.8,<2"]

[dependency-groups]
dev = ["pytest>=8.0"]
# The notebook's kernel. Declared rather than installed by hand, because
# `uv sync` prunes whatever the lockfile does not mention — installing it
# outside uv means the next sync silently removes it and the notebook stops
# starting.
notebook = ["ipykernel>=6.29"]

[project.scripts]
pokelike = "pokelike.interfaces.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokelike = ["core/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs the browser and the offline copy of the game"]
